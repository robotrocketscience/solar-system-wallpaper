[project]
name = "solar-system-wallpaper"
version = "0.1.0"
description = "Render beautiful solar system wallpapers using real ephemeris data from JPL Horizons"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pycairo>=1.26.0",
    "python-dateutil>=2.8.2",
]

[project.scripts]
solar-system-wallpaper = "solar_system_wallpaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_system_wallpaper"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
]
